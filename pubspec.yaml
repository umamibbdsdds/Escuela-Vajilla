name: umami
description: App UMAMI — Sistema de restaurante con roles, estados y tema centralizado.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  fl_chart: ^0.66.0
  http: ^1.1.0
  image_picker: ^1.0.4
  path_provider: ^2.1.1
  open_filex: ^4.3.2
  flutter_local_notifications: ^17.2.4
  shared_preferences: ^2.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/UMAMI_Logo_transparente.png
    - assets/icon/fondoR.png
    - assets/icon/app_icon.png
    - assets/icon/logo.png
