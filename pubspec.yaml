name: restaurante_app
description: "Aplicación móvil de gestión de restaurante Umami"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  image_picker: ^1.0.4
  fl_chart: ^0.65.0
  path_provider: ^2.1.1
  open_filex: ^4.3.2
  flutter_local_notifications: ^17.2.4
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icon/fondoR.png
    - assets/icon/UMAMI_Logo_transparente.png
    - assets/icon/app_icon.png
    - assets/icon/logo.png
